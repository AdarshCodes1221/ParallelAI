services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    environment:
      - PORT=8000

    volumes:
      - ./backend:/app

    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "5173:80"

    environment:
      - VITE_API_URL=http://localhost:8000

    depends_on:
      - backend

    restart: always