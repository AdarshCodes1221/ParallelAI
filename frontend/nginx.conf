worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;

    # Allow file uploads up to 50MB
    client_max_body_size 50M;

    # Upstream pointing at the backend FastAPI service
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 50M;

        # ──────────────────────────────────────────────
        # API proxy: /api/* → backend:8000/api/*
        # The full request URI is preserved (no trailing
        # URI in proxy_pass), so /api/auth/me stays
        # /api/auth/me on the backend.
        # ──────────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend;

            # Standard proxy headers
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward auth cookies and CSRF tokens unchanged
            proxy_pass_request_body on;
            proxy_pass_request_headers on;

            # Support SSE / chunked streaming for /api/agent
            proxy_buffering    off;
            proxy_cache_bypass $http_upgrade;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # Health check passthrough (no /api prefix on backend)
        location = /health {
            proxy_pass http://backend/health;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_cache_bypass $http_upgrade;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ──────────────────────────────────────────────
        # Static frontend — everything else falls through
        # to the SPA index.html (history fallback)
        # ──────────────────────────────────────────────
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
